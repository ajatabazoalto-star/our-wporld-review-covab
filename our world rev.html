<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picken-Glish Kids 🐔</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --azul: #2989d8;
    --azul-oscuro: #1e5799;
    --verde: #27ae60;
    --amarillo: #f39c12;
    --rojo: #e74c3c;
    --rosa: #ff6b9d;
    --morado: #9b59b6;
    --gris: #f4f7fa;
    --texto: #2c3e50;
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--gris);
    color: var(--texto);
    display: flex;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ============ SIDEBAR ============ */
  .sidebar {
    width: 280px;
    background: linear-gradient(180deg, #1e5799 0%, #154360 100%);
    color: white;
    padding: 25px 15px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: fixed;
    height: 100vh;
    box-shadow: 6px 0 30px rgba(0,0,0,0.2);
    z-index: 100;
    overflow-y: auto;
  }

  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

  .logo {
    font-family: 'Baloo 2', cursive;
    font-size: 1.5rem;
    font-weight: 800;
    margin-bottom: 25px;
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.1);
    border-radius: 16px;
    letter-spacing: 0.5px;
  }

  .logo-emoji {
    font-size: 2rem;
    animation: wobble 2s ease-in-out infinite;
  }

  @keyframes wobble {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }

  .sidebar-section-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    opacity: 0.5;
    padding: 15px 15px 5px;
    font-weight: 700;
  }

  .sidebar-item {
    padding: 13px 16px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    font-size: 0.92rem;
    border: none;
    background: none;
    text-align: left;
    width: 100%;
  }

  .sidebar-item:hover {
    background: rgba(255,255,255,0.12);
    color: white;
    transform: translateX(5px);
  }

  .sidebar-item.active {
    background: white;
    color: var(--azul-oscuro);
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
  }

  .sidebar-item .icon { font-size: 1.3rem; }

  /* ============ MAIN ============ */
  .main {
    margin-left: 280px;
    flex: 1;
    min-height: 100vh;
  }

  /* ============ TOPBAR ============ */
  .topbar {
    background: white;
    padding: 18px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 20px rgba(0,0,0,0.05);
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .topbar-info h1 {
    font-family: 'Baloo 2', cursive;
    font-size: 1.6rem;
    color: var(--azul-oscuro);
    font-weight: 800;
  }

  .topbar-info p {
    font-size: 0.85rem;
    color: #7f8c8d;
    margin-top: 2px;
  }

  .topbar-stats {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .stat-pill {
    background: linear-gradient(135deg, #fff5e6, #ffe8cc);
    padding: 8px 16px;
    border-radius: 25px;
    font-weight: 800;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--amarillo);
    border: 2px solid #ffd699;
  }

  .stat-pill.verde {
    background: linear-gradient(135deg, #e6f9ed, #c8f0d6);
    color: var(--verde);
    border-color: #a3e4b8;
  }

  .stat-pill.rosa {
    background: linear-gradient(135deg, #ffe6ef, #ffcce0);
    color: var(--rosa);
    border-color: #ffa8c8;
  }

  /* ============ CONTENIDO ============ */
  .contenido {
    padding: 30px 40px 60px;
  }

  /* ============ GRID UNIDADES ============ */
  .grid-unidades {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 22px;
    margin-top: 10px;
  }

  .unidad-card {
    background: white;
    border-radius: 22px;
    padding: 26px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 20px rgba(30,87,153,0.08);
    border: 3px solid transparent;
  }

  .unidad-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 8px;
    background: linear-gradient(90deg, var(--azul), var(--verde));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s;
  }

  .unidad-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 22px 45px rgba(30,87,153,0.18);
    border-color: var(--azul);
  }

  .unidad-card:hover::before { transform: scaleX(1); }

  .unidad-icon {
    font-size: 3.5rem;
    margin-bottom: 14px;
    display: block;
    line-height: 1;
  }

  .unidad-card h3 {
    font-family: 'Baloo 2', cursive;
    color: var(--azul-oscuro);
    font-size: 1.35rem;
    margin-bottom: 6px;
    font-weight: 800;
  }

  .unidad-card .num {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #95a5a6;
    font-weight: 800;
    margin-bottom: 4px;
  }

  .unidad-card p {
    color: #7f8c8d;
    font-size: 0.9rem;
    line-height: 1.5;
    margin-bottom: 14px;
  }

  .unidad-badge {
    display: inline-block;
    padding: 5px 14px;
    background: #e8f4fd;
    color: var(--azul);
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .unidad-badge.completada { background: #d5f4e6; color: var(--verde); }
  .unidad-badge.progreso { background: #fff3cd; color: #d68910; }

  /* ============ VISTA DE UNIDAD (LECCIÓN) ============ */
  .vista-unidad { display: none; }
  .vista-unidad.activa { display: block; animation: fadeUp 0.4s ease; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .volver-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: white;
    border: 2px solid #e1ecf7;
    padding: 10px 20px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: 700;
    color: var(--azul-oscuro);
    margin-bottom: 22px;
    font-size: 0.9rem;
    transition: all 0.2s;
    font-family: inherit;
  }

  .volver-btn:hover {
    background: var(--azul);
    color: white;
    border-color: var(--azul);
    transform: translateX(-3px);
  }

  /* TABS DE ACTIVIDADES */
  .tabs-actividades {
    display: flex;
    gap: 8px;
    margin-bottom: 25px;
    flex-wrap: wrap;
    background: white;
    padding: 8px;
    border-radius: 18px;
    box-shadow: 0 2px 15px rgba(0,0,0,0.06);
  }

  .tab-btn {
    padding: 10px 20px;
    border-radius: 12px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-weight: 700;
    color: #7f8c8d;
    font-size: 0.9rem;
    transition: all 0.25s;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tab-btn:hover { background: #f4f7fa; color: var(--azul); }

  .tab-btn.active {
    background: linear-gradient(135deg, var(--azul), var(--azul-oscuro));
    color: white;
    box-shadow: 0 4px 15px rgba(41,137,216,0.35);
  }

  .panel-actividad { display: none; }
  .panel-actividad.activa { display: block; animation: fadeUp 0.35s ease; }

  /* VOCABULARIO - TARJETAS */
  .grid-vocab {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }

  .vocab-card {
    background: white;
    border-radius: 18px;
    padding: 20px 15px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    border: 3px solid #f0f4f8;
    position: relative;
    overflow: hidden;
  }

  .vocab-card:hover {
    transform: translateY(-6px) scale(1.02);
    border-color: var(--azul);
    box-shadow: 0 15px 35px rgba(41,137,216,0.2);
  }

  .vocab-card .vocab-emoji {
    font-size: 3.5rem;
    display: block;
    margin-bottom: 10px;
    line-height: 1;
    transition: transform 0.3s;
  }

  .vocab-card:hover .vocab-emoji { transform: scale(1.15) rotate(-5deg); }

  .vocab-card .vocab-palabra {
    font-family: 'Baloo 2', cursive;
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--azul-oscuro);
    margin-bottom: 3px;
  }

  .vocab-card .vocab-traduccion {
    font-size: 0.85rem;
    color: #95a5a6;
    font-weight: 600;
  }

  .audio-indicator {
    position: absolute;
    top: 10px; right: 10px;
    width: 28px; height: 28px;
    background: var(--azul);
    border-radius: 50%;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .vocab-card:hover .audio-indicator { opacity: 1; }

  /* GRAMÁTICA */
  .grammar-box {
    background: white;
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    margin-bottom: 20px;
    border-left: 6px solid var(--amarillo);
  }

  .grammar-box h3 {
    font-family: 'Baloo 2', cursive;
    color: var(--amarillo);
    font-size: 1.3rem;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .grammar-ejemplo {
    background: #fffbee;
    padding: 15px 20px;
    border-radius: 12px;
    margin: 10px 0;
    font-size: 1rem;
    border-left: 4px solid var(--amarillo);
  }

  .grammar-ejemplo .en {
    font-weight: 800;
    color: var(--azul-oscuro);
    font-size: 1.1rem;
    display: block;
    margin-bottom: 5px;
  }

  .grammar-ejemplo .es {
    color: #7f8c8d;
    font-size: 0.9rem;
    font-style: italic;
  }

  /* EJERCICIOS */
  .ejercicio-box {
    background: white;
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    margin-bottom: 20px;
  }

  .ejercicio-pregunta {
    font-family: 'Baloo 2', cursive;
    font-size: 1.25rem;
    color: var(--azul-oscuro);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
  }

  .opciones-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
  }

  .opcion-btn {
    padding: 18px 12px;
    border: 3px solid #e1ecf7;
    background: white;
    border-radius: 14px;
    cursor: pointer;
    font-weight: 800;
    font-size: 1rem;
    color: var(--texto);
    transition: all 0.25s;
    font-family: inherit;
    position: relative;
  }

  .opcion-btn:hover:not(:disabled) {
    border-color: var(--azul);
    color: var(--azul);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(41,137,216,0.15);
  }

  .opcion-btn.correcta {
    background: #d5f4e6;
    border-color: var(--verde);
    color: var(--verde);
  }

  .opcion-btn.incorrecta {
    background: #fde2e2;
    border-color: var(--rojo);
    color: var(--rojo);
  }

  .opcion-btn:disabled { cursor: not-allowed; }

  .feedback {
    margin-top: 15px;
    padding: 12px 18px;
    border-radius: 12px;
    font-weight: 700;
    display: none;
    align-items: center;
    gap: 8px;
  }

  .feedback.show { display: flex; animation: fadeUp 0.3s; }
  .feedback.ok { background: #d5f4e6; color: var(--verde); }
  .feedback.err { background: #fde2e2; color: var(--rojo); }

  /* LISTENING */
  .listening-box {
    background: linear-gradient(135deg, #f8fbff, #eaf4ff);
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    margin-bottom: 20px;
    border: 3px dashed #c5dff5;
  }

  .listening-icon {
    font-size: 4rem;
    margin-bottom: 15px;
    display: block;
    cursor: pointer;
    transition: transform 0.3s;
  }

  .listening-icon:hover { transform: scale(1.1); }

  .listening-box h3 {
    font-family: 'Baloo 2', cursive;
    color: var(--azul-oscuro);
    margin-bottom: 8px;
    font-size: 1.3rem;
  }

  .listening-box p { color: #7f8c8d; font-size: 0.9rem; margin-bottom: 18px; }

  .play-btn {
    background: linear-gradient(135deg, var(--verde), #1e8449);
    color: white;
    border: none;
    padding: 14px 32px;
    border-radius: 25px;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 6px 0 #1e8449;
    transition: all 0.15s;
    font-family: inherit;
  }

  .play-btn:hover { background: #2ecc71; }
  .play-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1e8449; }

  /* READING */
  .reading-box {
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    line-height: 1.8;
    font-size: 1.05rem;
    color: #34495e;
  }

  .reading-box h3 {
    font-family: 'Baloo 2', cursive;
    color: var(--azul-oscuro);
    margin-bottom: 15px;
    font-size: 1.5rem;
  }

  .reading-box .highlight {
    background: #fff3cd;
    padding: 2px 6px;
    border-radius: 5px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
  }

  .reading-box .highlight:hover { background: #ffe8a1; }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .sidebar { width: 220px; }
    .main { margin-left: 220px; }
    .contenido { padding: 20px; }
    .topbar { padding: 15px 20px; }
  }

  @media (max-width: 700px) {
    body { flex-direction: column; }
    .sidebar {
      position: relative;
      width: 100%;
      height: auto;
      flex-direction: row;
      overflow-x: auto;
      padding: 12px;
      gap: 8px;
    }
    .sidebar .logo { margin-bottom: 0; padding: 8px 12px; font-size: 1rem; white-space: nowrap; }
    .sidebar-section-title { display: none; }
    .sidebar-item { white-space: nowrap; padding: 10px 14px; font-size: 0.85rem; }
    .main { margin-left: 0; }
    .topbar { flex-direction: column; gap: 10px; align-items: flex-start; }
    .topbar-info h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<!-- ============ SIDEBAR ============ -->
<aside class="sidebar">
  <div class="logo">
    <span class="logo-emoji">🐔</span>
    <span>Picken-Glish<br><small style="font-size:0.65rem;opacity:0.7;">KIDS</small></span>
  </div>

  <button class="sidebar-item active" onclick="mostrarInicio(this)">
    <span class="icon">🏠</span> Inicio
  </button>

  <div class="sidebar-section-title">Unidades</div>

  <button class="sidebar-item" onclick="abrirUnidad(0, this)">
    <span class="icon">👋</span> Unit 0 · Welcome
  </button>
  <button class="sidebar-item" onclick="abrirUnidad(1, this)">
    <span class="icon">🏫</span> Unit 1 · My Classroom
  </button>
  <button class="sidebar-item" onclick="abrirUnidad(2, this)">
    <span class="icon">🌍</span> Unit 2 · My World
  </button>
  <button class="sidebar-item" onclick="abrirUnidad(3, this)">
    <span class="icon">👨‍👩‍👧</span> Unit 3 · My Family
  </button>
  <button class="sidebar-item" onclick="abrirUnidad(4, this)">
    <span class="icon">🏠</span> Unit 4 · My House
  </button>
  <button class="sidebar-item" onclick="abrirUnidad(5, this)">
    <span class="icon">👕</span> Unit 5 · Cool Clothes
  </button>
  <button class="sidebar-item" onclick="abrirUnidad(6, this)">
    <span class="icon">🧸</span> Unit 6 · My Toys
  </button>
  <button class="sidebar-item" onclick="abrirUnidad(7, this)">
    <span class="icon">🦵</span> Unit 7 · My Body
  </button>
  <button class="sidebar-item" onclick="abrirUnidad(8, this)">
    <span class="icon">🍎</span> Unit 8 · Good Food
  </button>
  <button class="sidebar-item" onclick="abrirUnidad(9, this)">
    <span class="icon">🐾</span> Unit 9 · Animal Friends
  </button>
</aside>

<!-- ============ MAIN ============ -->
<main class="main">
  <header class="topbar">
    <div class="topbar-info">
      <h1 id="tituloTop">¡Hola, pequeño explorador! 🌟</h1>
      <p id="subtituloTop">Aprende inglés jugando con Picken-Glish Kids</p>
    </div>
    <div class="topbar-stats">
      <div class="stat-pill">⭐ <span id="xp">0</span> XP</div>
      <div class="stat-pill verde">🔥 <span id="racha">1</span> días</div>
      <div class="stat-pill rosa">🏆 <span id="nivel">1</span></div>
    </div>
  </header>

  <div class="contenido">

    <!-- ============ VISTA INICIO ============ -->
    <div id="vistaInicio" class="vista-unidad activa">
      <h2 style="font-family:'Baloo 2';color:var(--azul-oscuro);margin-bottom:8px;font-size:1.8rem;">📚 Elige una unidad</h2>
      <p style="color:#7f8c8d;margin-bottom:25px;">Aprende vocabulario, gramática, listening y reading paso a paso.</p>

      <div class="grid-unidades" id="gridUnidades"></div>
    </div>

    <!-- ============ VISTA UNIDAD (se llena dinámicamente) ============ -->
    <div id="vistaUnidad" class="vista-unidad"></div>

  </div>
</main>

<script>
/* =====================================================
   DATOS DE LAS UNIDADES (extraídos del libro Our World 1)

      { emoji: "9️⃣", en: "Nine", es: "Nueve" },
      { emoji: "🔟", en: "Ten", es: "Diez" }
    ],
    grammar: [
      { titulo: "What's your name?", en: "What's your name? — My name is Mía.", es: "¿Cómo te llamas? — Me llamo Mía." },
      { titulo: "How old are you?", en: "How old are you? — I'm five.", es: "¿Cuántos años tienes? — Tengo cinco." },

/* =====================================================
   LÓGICA DE LA APP
   ===================================================== */
let xpActual = 0;
let nivelActual = 1;
let unidadActual = null;
let actividadActual = 0;

// Renderizar grid de unidades
function renderGrid() {
  const grid = document.getElementById('gridUnidades');
  grid.innerHTML = UNIDADES.map((u, i) => `
    <div class="unidad-card" onclick="abrirUnidad(${i}, null)">
      <span class="num">Unit ${u.id}</span>
      <span class="unidad-icon">${u.emoji}</span>
      <h3>${u.titulo}</h3>
      <p>${u.desc}</p>
      <span class="unidad-badge">${u.vocab.length} palabras</span>
    </div>
  `).join('');
}

// Mostrar inicio
function mostrarInicio(btn) {
  document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('vistaInicio').classList.add('activa');
  document.getElementById('vistaUnidad').classList.remove('activa');
  document.getElementById('tituloTop').textContent = '¡Hola, pequeño explorador! 🌟';
  document.getElementById('subtituloTop').textContent = 'Aprende inglés jugando con Picken-Glish Kids';
}

// Abrir una unidad
function abrirUnidad(index, btn) {
  if (btn) {
    document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  unidadActual = UNIDADES[index];
  actividadActual = 0;

  document.getElementById('vistaInicio').classList.remove('activa');
  const vista = document.getElementById('vistaUnidad');
  vista.classList.add('activa');
  document.getElementById('tituloTop').textContent = `Unit ${unidadActual.id} · ${unidadActual.titulo} ${unidadActual.emoji}`;
  document.getElementById('subtituloTop').textContent = unidadActual.desc;

  vista.innerHTML = `
    <button class="volver-btn" onclick="mostrarInicio(null)">← Volver al inicio</button>

    <div class="tabs-actividades">
      <button class="tab-btn active" onclick="cambiarTab(0, this)">📚 Vocabulario</button>
      <button class="tab-btn" onclick="cambiarTab(1, this)">📝 Gramática</button>
      <button class="tab-btn" onclick="cambiarTab(2, this)">🎧 Listening</button>
      <button class="tab-btn" onclick="cambiarTab(3, this)">📖 Reading</button>
      <button class="tab-btn" onclick="cambiarTab(4, this)">🎯 Ejercicios</button>
    </div>

    <div id="panelContenido"></div>
  `;
  renderPanel(0);
}

// Cambiar tab
function cambiarTab(idx, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  actividadActual = idx;
  renderPanel(idx);
}

// Renderizar panel según actividad
function renderPanel(idx) {
  const panel = document.getElementById('panelContenido');
  const u = unidadActual;

  if (idx === 0) {
    // VOCABULARIO
    panel.innerHTML = `
      <div class="panel-actividad activa">
        <h2 style="font-family:'Baloo 2';color:var(--azul-oscuro);margin-bottom:8px;">📚 Vocabulario</h2>
        <p style="color:#7f8c8d;margin-bottom:20px;">Haz clic en cada tarjeta para escuchar la pronunciación 🔊</p>
        <div class="grid-vocab">
          ${u.vocab.map(v => `
            <div class="vocab-card" onclick="hablar('${v.en}')">
              <div class="audio-indicator">🔊</div>
              <span class="vocab-emoji">${v.emoji}</span>
              <div class="vocab-palabra">${v.en}</div>
              <div class="vocab-traduccion">${v.es}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } else if (idx === 1) {
    // GRAMÁTICA
    panel.innerHTML = `
      <div class="panel-actividad activa">
        <h2 style="font-family:'Baloo 2';color:var(--azul-oscuro);margin-bottom:8px;">📝 Gramática</h2>
        <p style="color:#7f8c8d;margin-bottom:20px;">Aprende las estructuras clave de esta unidad.</p>
        ${u.grammar.map(g => `
          <div class="grammar-box">
            <h3>💡 ${g.titulo}</h3>
            <div class="grammar-ejemplo" onclick="hablar('${g.en.replace(/'/g, "\\'")}')" style="cursor:pointer;">
              <span class="en">🔊 ${g.en}</span>
              <span class="es">${g.es}</span>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  } else if (idx === 2) {
    // LISTENING
    panel.innerHTML = `
      <div class="panel-actividad activa">
        <h2 style="font-family:'Baloo 2';color:var(--azul-oscuro);margin-bottom:8px;">🎧 Listening</h2>
        <p style="color:#7f8c8d;margin-bottom:20px;">Escucha con atención y repite en voz alta.</p>
        <div class="listening-box">
          <span class="listening-icon" onclick="hablar('${u.listening.replace(/'/g, "\\'")}')">🎧</span>
          <h3>Audio de la unidad</h3>
          <p>Presiona el botón para escuchar el audio</p>
          <button class="play-btn" onclick="hablar('${u.listening.replace(/'/g, "\\'")}')">▶ Reproducir audio</button>
          <div style="margin-top:20px;padding:18px;background:white;border-radius:12px;text-align:left;font-size:0.95rem;color:#34495e;line-height:1.7;">
            <strong style="color:var(--azul-oscuro);">📄 Transcripción:</strong><br>
            ${u.listening}
          </div>
        </div>
      </div>
    `;
  } else if (idx === 3) {
    // READING
    panel.innerHTML = `
      <div class="panel-actividad activa">
        <h2 style="font-family:'Baloo 2';color:var(--azul-oscuro);margin-bottom:8px;">📖 Reading</h2>
        <p style="color:#7f8c8d;margin-bottom:20px;">Lee el texto y haz clic en las palabras resaltadas para escucharlas.</p>
        <div class="reading-box">
          <h3>${u.reading.titulo}</h3>
          <p>${u.reading.texto}</p>
          <button class="play-btn" style="margin-top:20px;" onclick="hablar('${u.reading.texto.replace(/'/g, "\\'")}')">▶ Leer en voz alta</button>
        </div>
      </div>
    `;
  } else if (idx === 4) {
    // EJERCICIOS
    panel.innerHTML = `
      <div class="panel-actividad activa">
        <h2 style="font-family:'Baloo 2';color:var(--azul-oscuro);margin-bottom:8px;">🎯 Ejercicios</h2>
        <p style="color:#7f8c8d;margin-bottom:20px;">Responde cada pregunta. ¡Gana XP por cada acierto!</p>
        ${u.ejercicios.map((e, i) => `
          <div class="ejercicio-box">
            <div class="ejercicio-pregunta">❓ ${i+1}. ${e.pregunta}</div>
            <div class="opciones-grid">
              ${e.opciones.map((op, j) => `
                <button class="opcion-btn" onclick="responder(this, ${j === e.correcta})">${op}</button>
              `).join('')}
            </div>
            <div class="feedback"></div>
          </div>
        `).join('')}
      </div>
    `;
  }
}

// Responder ejercicio
function responder(btn, esCorrecta) {
  const box = btn.closest('.ejercicio-box');
  const feedback = box.querySelector('.feedback');
  const botones = box.querySelectorAll('.opcion-btn');

  botones.forEach(b => b.disabled = true);

  if (esCorrecta) {
    btn.classList.add('correcta');
    feedback.textContent = '✅ ¡Correcto! +10 XP';
    feedback.className = 'feedback show ok';
    sumarXP(10);
  } else {
    btn.classList.add('incorrecta');
    feedback.textContent = '❌ ¡Intenta de nuevo en otra ronda!';
    feedback.className = 'feedback show err';
  }
}

// Sumar XP
function sumarXP(cantidad) {
  xpActual += cantidad;
  document.getElementById('xp').textContent = xpActual;
  if (xpActual >= nivelActual * 50) {
    nivelActual++;
    document.getElementById('nivel').textContent = nivelActual;
  }
}

// Hablar (Text to Speech)
function hablar(texto) {
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'en-US';
    u.rate = 0.85;
    u.pitch = 1.1;
    speechSynthesis.speak(u);
  } else {
    alert('Tu navegador no soporta síntesis de voz 😢');
  }
}

/* =====================================================
   INICIALIZAR
   ===================================================== */
renderGrid();
</script>
